            summary: "{{title}}"
            fields:
              - {label: "Publicada", name: "published", widget: "boolean", default: true, hint: "Desmarca para ocultarla de la web sin borrarla"}
              - {label: "Destacada", name: "featured", widget: "boolean", default: false, hint: "Las destacadas aparecen primero en la sección"}
              - {label: "Categoría", name: "eyebrow", widget: "string", default: "Ejercicio", hint: "Ej. Ejercicio, Consejo de oficio, Bloqueo creativo, Recursos"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Subtítulo o entradilla", name: "subtitle", widget: "string", required: false}
