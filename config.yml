              - {label: "Autor/a", name: "author", widget: "string", required: false}
              - {label: "Fecha", name: "date", widget: "datetime", required: false, format: "DD/MM/YYYY"}
              - {label: "Imagen destacada", name: "image", widget: "image", required: false}
              - label: "Origen de la imagen"
