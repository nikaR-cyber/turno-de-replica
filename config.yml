              - label: "Historia completa"
                name: "body"
                widget: "text"
                required: false
                hint: "Úsalo para El Datazo, Redescubriendo Vidas y El Viajero. Para 'Pieza del mes' usa mejor los 4 campos de arriba. Deja una línea en blanco entre párrafos. Para insertar una imagen dentro del texto, escribe ![descripción](URL de la imagen) en su propia línea. Para un enlace, escribe [texto del enlace](URL)."
