backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "legal"
    label: "Documentos Legales"
    files:
      - name: "documentos"
        label: "Documentos Legales"
        file: "content/legal.json"
        fields:
          - label: "Documentos"
            name: "entries"
            widget: "list"
            label_singular: "Documento"
            summary: "{{title}}"
            fields:
              - {label: "Publicado (visible en la web)", name: "active", widget: "boolean", default: false, hint: "Actívalo solo cuando el texto esté listo y la funcionalidad a la que corresponde exista realmente."}
              - {label: "Orden en el panel", name: "order", widget: "number", value_type: "int", default: 1}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "URL (slug)", name: "slug", widget: "string", hint: "Ej. aviso-legal — se usará como /legal/aviso-legal"}
              - {label: "Versión", name: "version", widget: "string", required: false, hint: "Ej. v1.0 — para poder registrar qué versión aceptó cada usuario en el futuro"}
              - {label: "Fecha de entrada en vigor", name: "effective_date", widget: "datetime", required: false, format: "DD/MM/YYYY"}
              - label: "Contenido"
                name: "content"
                widget: "text"
                hint: "Pega aquí el texto legal completo, literalmente. Deja una línea en blanco entre párrafos."

  - name: "ecos-de-papel"
    label: "Ecos de Papel"
    files:
      - name: "club-lectura"
        label: "Club de Lectura Ecos de Papel"
        file: "content/ecos-de-papel.json"
        fields:
          - {label: "Enlace de invitación a Discord", name: "discord_url", widget: "string", required: false, hint: "Pega aquí el enlace de invitación al servidor de Discord."}
          - label: "Lectura actual"
            name: "current_reading"
            widget: "object"
            required: false
            fields:
              - {label: "Título", name: "title", widget: "string", required: false}
              - {label: "Autor/a", name: "author", widget: "string", required: false}
              - {label: "Portada", name: "cover", widget: "image", required: false}
          - label: "Próxima lectura"
            name: "next_reading"
            widget: "object"
            required: false
            fields:
              - {label: "Título", name: "title", widget: "string", required: false}
              - {label: "Autor/a", name: "author", widget: "string", required: false}
              - {label: "Fecha de inicio", name: "date", widget: "string", required: false, hint: "Ej. Septiembre 2026"}
          - label: "Lecturas anteriores"
            name: "previous_readings"
            widget: "list"
            required: false
            label_singular: "Lectura"
            summary: "{{title}}"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Autor/a", name: "author", widget: "string", required: false}
          - label: "Anuncios del corcho"
            name: "announcements"
            widget: "list"
            required: false
            label_singular: "Anuncio"
            summary: "{{text}}"
            hint: "Notas cortas tipo 'Quedada de lectura el día X', se muestran como notas clavadas en el corcho."
            fields:
              - {label: "Texto", name: "text", widget: "string"}
              - {label: "Fecha (opcional)", name: "date", widget: "string", required: false}
              - {label: "Color de la nota", name: "color", widget: "select", options: ["Rosa", "Menta", "Dorado", "Melocotón"], default: "Rosa"}

  - name: "trama-y-drama"
    label: "La Trama y el Drama"
    files:
      - name: "entradas"
        label: "Entradas de La Trama y el Drama"
        file: "content/trama-y-drama.json"
        fields:
          - label: "Entradas"
            name: "entries"
            widget: "list"
            label_singular: "Entrada"
            summary: "{{title}}"
            fields:
              - {label: "Publicada", name: "published", widget: "boolean", default: true, hint: "Desmarca para ocultarla de la web sin borrarla"}
              - {label: "Destacada (aparece primero en la sección)", name: "featured", widget: "boolean", default: false}
              - label: "Categoría"
                name: "eyebrow"
                widget: "select"
                options:
                  - "📚 Novedades editoriales"
                  - "🔮 Lo que viene"
                  - "👀 En el radar"
                  - "🔥 El fenómeno"
                  - "✍️ Entre autores"
                  - "🏛️ Mundo editorial"
                  - "🎬 Del libro a la pantalla"
                  - "📈 Qué está leyendo todo el mundo"
                  - "💌 Próxima parada: librería"
                default: "📚 Novedades editoriales"
              - label: "Destacada (franja superior)"
                name: "featured_banner"
                widget: "select"
                required: false
                hint: "Elige en cuál de los 5 huecos destacados de la home de esta sección aparece esta entrada. Deja 'Ninguna' si no debe aparecer ahí."
                options:
                  - "Ninguna"
                  - "Hoy está ardiendo"
                  - "Todo el mundo está hablando de..."
                  - "El debate"
                  - "Lo que viene"
                  - "El salseo de la semana"
                default: "Ninguna"
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Subtítulo o entradilla", name: "subtitle", widget: "string", required: false}
              - {label: "URL (slug)", name: "slug", widget: "string", required: false, hint: "Déjalo vacío y se genera solo a partir del título. Solo edítalo si quieres una URL concreta."}
              - {label: "Autor/a", name: "author", widget: "string", required: false}
              - {label: "Fecha", name: "date", widget: "datetime", required: false, format: "DD/MM/YYYY"}
              - {label: "Imagen destacada", name: "image", widget: "image", required: false}
              - label: "Origen de la imagen"
                name: "image_source"
                widget: "select"
                required: false
                hint: "Uso interno, para poder aplicar más adelante las obligaciones de transparencia que correspondan. No se muestra automáticamente en la web."
                options:
                  - "Fotografía propia"
                  - "Fotografía con licencia"
                  - "Ilustración propia"
                  - "Generada mediante IA"
                  - "Generada o manipulada mediante IA"
                  - "Otra"
              - {label: "Crédito/atribución de la imagen", name: "image_credit", widget: "string", required: false, hint: "Ej. 'Foto: María López'. Si lo rellenas, aparecerá bajo la imagen en la página de la entrada."}
              - {label: "Enlace/fuente de la imagen", name: "image_credit_url", widget: "string", required: false, hint: "Opcional. Si lo rellenas, el crédito de arriba será un enlace a esta URL."}
              - {label: "Extracto (resumen para la tarjeta)", name: "text", widget: "text", hint: "Texto corto que se ve en la tarjeta de la sección"}
              - label: "Contenido completo"
                name: "body"
                widget: "text"
                required: false
                hint: "Si lo dejas vacío, se mostrará el extracto como contenido completo. Deja una línea en blanco entre párrafos. Para insertar una imagen dentro del texto, escribe ![descripción](URL de la imagen) en su propia línea. Para un enlace, escribe [texto del enlace](URL)."
              - {label: "Etiquetas", name: "tags", widget: "string", required: false, hint: "Separadas por comas"}
              - label: "Enlaces externos"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - {label: "Texto del enlace", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

